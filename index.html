<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pemantauan Jaringan - Daop 4</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
            <div class="h-3 w-3 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_12px_rgba(16,185,129,0.5)]"></div>
            <h1 class="text-base sm:text-lg font-semibold tracking-tight text-white">Network Operation Center | Daop 4</h1>
        </div>
        <div class="flex items-center gap-4 text-xs text-slate-400">
            <span id="lastSync" class="bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/50">Memuat status...</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-8 space-y-8">
        
        <!-- Filter & Control Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900/40 border border-slate-800/80 p-6 rounded-2xl shadow-xl">
            <div>
                <h2 class="text-xl font-bold tracking-tight text-white">Status Ketersediaan Perangkat Stasiun</h2>
                <p class="text-xs sm:text-sm text-slate-400 mt-1">Pemantauan real-time status IP Address seluruh wilayah stasiun Daop 4.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <!-- Dropdown Pilih Stasiun -->
                <select id="stationFilter" class="bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-cyan-500 transition">
                    <option value="ALL">Semua Stasiun</option>
                </select>
                <!-- Input Cari IP -->
                <input type="text" id="searchInput" placeholder="Cari IP atau Status..." class="bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-cyan-500 transition placeholder:text-slate-500">
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="bg-slate-900/30 border border-slate-800/80 rounded-2xl overflow-hidden shadow-2xl backdrop-blur-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider bg-slate-900/80">
                            <th class="py-4 px-6">IP Address</th>
                            <th class="py-4 px-6">ID Stasiun</th>
                            <th class="py-4 px-6">Status Jaringan</th>
                            <th class="py-4 px-6">Terakhir Diperbarui</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800/40 text-sm">
                        <tr>
                            <td colspan="4" class="py-12 text-center text-slate-500 animate-pulse">Menghubungkan ke database Google Sheets...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Script JavaScript -->
    <script>
        // Ganti URL di bawah ini dengan URL Web App Google Apps Script Anda (berakhiran /exec)
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfH4dD_hrh61TG0X251m2RMGpW-2dF8KaZl3zMjG8Rgj__m2mT7_GyrLLWXb6tEB6TkA/exec";

        let allData = [];

        async function fetchSheetData() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                if (!response.ok) throw new Error("Gagal mengambil data JSON");
                
                const jsonData = await response.json();
                processData(jsonData);
            } catch (error) {
                console.error("Gagal memuat:", error);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" class="py-12 text-center text-red-400">Gagal memuat data. Periksa URL Apps Script atau koneksi.</td></tr>`;
            }
        }

        function processData(jsonData) {
            allData = [];
            const stationSet = new Set();

            jsonData.forEach(row => {
                const ip = row.ip ? String(row.ip).trim() : '';
                const lokasi_id = row.lokasi_id ? String(row.lokasi_id).trim() : '';
                const status = row.status ? String(row.status).trim() : 'Aktif';
                const last_update = row.last_update ? String(row.last_update).trim() : '-';

                if (ip) {
                    allData.push({ ip, lokasi_id, status, last_update });
                    if (lokasi_id) stationSet.add(lokasi_id);
                }
            });

            if (allData.length === 0) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" class="py-12 text-center text-amber-400">Data kosong.</td></tr>`;
                return;
            }

            populateDropdown(Array.from(stationSet));
            renderTable(allData);
            document.getElementById('lastSync').innerText = "Sinkron Terakhir: " + new Date().toLocaleTimeString();
        }

        function populateDropdown(stations) {
            const select = document.getElementById('stationFilter');
            const currentVal = select.value;
            select.innerHTML = '<option value="ALL">Semua Stasiun</option>';
            stations.sort().forEach(st => {
                const opt = document.createElement('option');
                opt.value = st;
                opt.textContent = st.toUpperCase();
                select.appendChild(opt);
            });
            select.value = currentVal;
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-12 text-center text-slate-500">Tidak ada data yang ditemukan.</td></tr>`;
                return;
            }

            let html = "";
            const displayData = data.slice(0, 500);

            displayData.forEach(row => {
                const isActive = row.status.toLowerCase() === "aktif";
                const badgeClass = isActive 
                    ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/20 shadow-[0_0_8px_rgba(16,185,129,0.1)]" 
                    : "bg-rose-500/10 text-rose-400 border-rose-500/20";
                
                const dotClass = isActive ? "bg-emerald-500 animate-pulse" : "bg-rose-500";

                html += `
                    <tr class="hover:bg-slate-800/40 transition-colors">
                        <td class="py-3.5 px-6 font-mono text-slate-200">${row.ip}</td>
                        <td class="py-3.5 px-6 font-medium text-slate-300 uppercase">${row.lokasi_id}</td>
                        <td class="py-3.5 px-6">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium border ${badgeClass}">
                                <span class="h-1.5 w-1.5 rounded-full ${dotClass}"></span>
                                ${row.status}
                            </span>
                        </td>
                        <td class="py-3.5 px-6 text-slate-400 text-xs">${row.last_update}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function filterData() {
            const stationVal = document.getElementById('stationFilter').value;
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allData.filter(item => {
                const matchStation = (stationVal === "ALL" || item.lokasi_id === stationVal);
                const matchSearch = item.ip.toLowerCase().includes(searchVal) || item.status.toLowerCase().includes(searchVal);
                return matchStation && matchSearch;
            });

            renderTable(filtered);
        }

        document.getElementById('stationFilter').addEventListener('change', filterData);
        document.getElementById('searchInput').addEventListener('input', filterData);

        fetchSheetData();
        setInterval(fetchSheetData, 1800000);
    </script>
</body>
</html>
